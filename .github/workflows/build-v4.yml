name: Build Skill Arena

on:
  push:
    branches:
      - main
      - develop
      - mobile-test
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "audit/**"
      - "qa/**"
      - "v*-mobile"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run redundant. Stable branches
# are never cancelled so their result is always recorded.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/mobile-test' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The determinism suite alone takes ~5.5 min on a fast machine.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: skill_arena_test
          POSTGRES_PASSWORD: local-test-only-skill-arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skill_arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Determinism and device-equivalence tests
        run: pnpm test:determinism

      - name: PostgreSQL repository integration tests
        run: pnpm test:repository
        env:
          TEST_DATABASE_URL: postgres://postgres:local-test-only-skill-arena@127.0.0.1:5432/skill_arena_test

      - name: Build
        run: pnpm build

      # Informational: a newly published advisory should not block unrelated work.
      # Dependabot opens the fixing pull request.
      - name: Dependency audit (informational)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
