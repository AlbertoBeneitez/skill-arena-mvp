name: Build Skill Arena

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "v*-mobile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: skill_arena_test
          POSTGRES_PASSWORD: local-test-only-skill-arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skill_arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Determinism and device-equivalence tests
        run: pnpm test:determinism

      - name: PostgreSQL repository integration tests
        run: pnpm test:repository
        env:
          TEST_DATABASE_URL: postgres://postgres:local-test-only-skill-arena@127.0.0.1:5432/skill_arena_test

      - name: Build
        run: pnpm build
