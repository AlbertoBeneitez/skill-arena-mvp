name: Simulador de bots (nocturno)

# Bot simulator (docs/SIMULADOR_BOTS.md): every night, on GitHub's own runner, the production build runs locally
# against a throwaway PostgreSQL and «Bot …» players use it: accounts, full real-time matches, a group competition,
# cheaters, Mine Grid, Solitaire and the UI. Nothing touches Vercel or Neon, so it costs nothing (public repository).
# The report is attached to the run and shown in its summary; known findings do not fail the job.

on:
  # GitHub only runs scheduled workflows from the default branch: until this file reaches it, every push to
  # mobile-test (one per session) runs the bots instead.
  push:
    branches: [mobile-test]
  schedule:
    - cron: "17 2 * * *" # 03:17 in Madrid (winter)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-bots
  cancel-in-progress: true

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: skill_arena_sim
          POSTGRES_PASSWORD: local-sim-only-skill-arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skill_arena_sim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIM_DATABASE_URL: postgres://postgres:local-sim-only-skill-arena@127.0.0.1:5432/skill_arena_sim
      SIM_AUTH_SECRET: sim-ci-secret-0123456789-abcdefghijklmnop
      SIM_BASE: http://127.0.0.1:3200
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: mobile-test

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright outside the project
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start the local server (durable matches and hidden Mine Grid on)
        run: |
          scripts/sim/start-server.sh > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf "$SIM_BASE/api/health" >/dev/null && break; sleep 1; done
          curl -sf "$SIM_BASE/api/health"

      - name: API bots (people, matches, group, cheaters, best-of-N, Mine Grid)
        run: SIM_PLAYERS=12 SIM_MATCHES=2 pnpm sim

      - name: UI bots (phones and computer)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node scripts/sim/ui-bots.cjs 6 50

      - name: Solitaire bots
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node scripts/sim/solitaire-bot.cjs 2

      - name: Summary
        if: always()
        run: |
          for f in sim-reports/*/report.md; do [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"; done
          cp "$RUNNER_TEMP/server.log" sim-reports/server.log 2>/dev/null || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-reports
          path: sim-reports/
          retention-days: 14
